name: vmpunpack release build

# Builds the patched analyzer.exe that vmpunpack drives, and packages it the way
# vmpunpack's setup.cmd expects. Windows x64 release only - the other platforms
# and configurations upstream builds are not relevant to this branch.

on:
  push:
    branches: [vmpunpack]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# Release assets are uploaded by hand from a run that has been verified against a
# known-good bundle, so publishing a release deliberately does NOT rebuild and
# overwrite them.

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # The Steam bridge is off on this branch (cmake/steam-bridge.cmake); it is passed explicitly so a
      # change of that default cannot put the host Steam backend back into a release unnoticed. With it
      # off, configure does not run the libclang-based generator or fetch Valve's Proton repository.
      - name: Build
        run: cmake --preset=release -DSOGEN_ENABLE_STEAM=OFF && cmake --build --preset=release

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse build/release/artifacts | Select-Object Length, FullName

      # build/release/artifacts holds ~1 GB of .lib, .pdb, fuzzers and test binaries.
      # vmpunpack needs 4 built binaries, the MSVC runtime and the SLEIGH data - nothing else.
      - name: Package for vmpunpack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "pkg"
          New-Item -ItemType Directory -Force $out | Out-Null

          $built = @("analyzer.exe", "icicle-emulator.dll", "unicorn-emulator.dll", "whp-emulator.dll")
          foreach ($f in $built) {
            $src = "build/release/artifacts/$f"
            if (-not (Test-Path $src)) { throw "build did not produce $f" }
            Copy-Item -Force $src $out
          }

          # Not build output: these come from the VC redistributable on the runner, which is the
          # same toolset that produced analyzer.exe, so the versions match by construction.
          $runtime = @("msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "msvcp140_atomic_wait.dll",
                       "msvcp140_codecvt_ids.dll", "vcruntime140.dll", "vcruntime140_1.dll",
                       "vcruntime140_threads.dll", "concrt140.dll", "vccorlib140.dll")
          $redist = $env:VCToolsRedistDir
          $crt = $null
          if ($redist) { $crt = Get-ChildItem -Path $redist -Recurse -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
                                Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 }
          if (-not $crt) {
            $crt = Get-ChildItem "C:/Program Files/Microsoft Visual Studio/2022/*/VC/Redist/MSVC" -Recurse -Directory `
                     -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          }
          if (-not $crt) { throw "could not locate the x64 VC redistributable CRT directory" }
          Write-Host "VC redist: $($crt.FullName)"
          foreach ($f in $runtime) {
            $src = Join-Path $crt.FullName $f
            if (-not (Test-Path $src)) { throw "VC redist is missing $f" }
            Copy-Item -Force $src $out
          }

          # SLEIGH data from commit 2, compiled by icicle at load time.
          $sleigh = if (Test-Path "build/release/artifacts/Ghidra") { "build/release/artifacts/Ghidra" }
                    else { "src/backends/icicle-emulator/icicle-bridge/data/Ghidra" }
          if (-not (Test-Path $sleigh)) { throw "SLEIGH data not found" }
          New-Item -ItemType Directory -Force "$out/Ghidra" | Out-Null
          Copy-Item -Recurse -Force "$sleigh/*" "$out/Ghidra"

          $top = (Get-ChildItem -File $out).Count
          $sinc = (Get-ChildItem -Recurse -File "$out/Ghidra").Count
          Write-Host "packaged: $top top-level files, $sinc SLEIGH files"
          if ($top -ne ($built.Count + $runtime.Count)) { throw "expected $($built.Count + $runtime.Count) top-level files, got $top" }
          if ($sinc -lt 40) { throw "SLEIGH data looks incomplete ($sinc files)" }
          Get-ChildItem -Recurse -File $out | ForEach-Object {
            "{0,10:n0}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path $out).Path.Length + 1)
          }

          Compress-Archive -Path "$out/*" -DestinationPath sogen-vmpunpack-win-x64.zip -Force
          "{0:n1} MB" -f ((Get-Item sogen-vmpunpack-win-x64.zip).Length / 1MB)
          Get-FileHash sogen-vmpunpack-win-x64.zip -Algorithm SHA256 | Format-List

      # Proves the patch actually made it into this binary, rather than silently
      # building stock upstream.
      - name: Verify the patch is present in the built analyzer
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("pkg/analyzer.exe")
          $text  = [Text.Encoding]::ASCII.GetString($bytes)
          $want  = @("SOGEN_UNPACK", "SOGEN_STOP_AT_OEP", "SOGEN_OEP_RVA", "SOGEN_LATEDUMP_AT",
                     "SOGEN_NODELAY", "SOGEN_TSC_STRIDE", "SOGEN_ALLOW_NETWORK",
                     "C:\dumps\unpacked.bin", "C:\dumps\unpacked.meta", "[UNPACK] OEP=",
                     "[UNPACK] host network: blocked")
          $missing = @($want | Where-Object { -not $text.Contains($_) })
          foreach ($w in $want) {
            "{0,-28} {1}" -f $w, $(if ($text.Contains($w)) { "present" } else { "MISSING" })
          }
          if ($missing.Count) { throw "built analyzer.exe is missing: $($missing -join ', ')" }
          "all patch markers present"

          # The host bridges are closed by not being there: nothing references the Steam backend, the
          # Vulkan host or SDL, so the linker drops them. One of these strings coming back means a
          # bridge is linked again. Compared without regard to case, since an import table need not
          # spell a DLL the way the source does. "SDL_" covers SDL whatever the runner's SDK makes it
          # import; "GameInput.dll" is the import it pulled in on the build this was written against.
          $absent = @("steamclient64.dll", "SOGEN_STEAMCLIENT", "SteamAPI", "vulkan-1.dll", "vkCreateInstance",
                      "SDL_", "GameInput.dll")
          $has = { param($w) $text.IndexOf($w, [StringComparison]::OrdinalIgnoreCase) -ge 0 }
          foreach ($w in $absent) {
            "{0,-28} {1}" -f $w, $(if (& $has $w) { "PRESENT" } else { "absent" })
          }
          $leaked = @($absent | Where-Object { & $has $_ })
          if ($leaked.Count) { throw "built analyzer.exe still links a host bridge: $($leaked -join ', ')" }
          "no host bridge is linked"

      # The strings above prove that SOGEN_ALLOW_NETWORK is read, not which way the condition points.
      # This runs a benign guest against a listener on the runner's loopback, using the packaged files:
      # reached with SOGEN_ALLOW_NETWORK=1, not reached otherwise.
      - name: Verify the guest's network is blocked by default
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://sogen.dev/root.zip -OutFile root.zip
          New-Item -ItemType Directory -Force emu | Out-Null
          tar -xf root.zip -C emu
          if ($LASTEXITCODE) { throw "could not extract the emulation root" }
          $root = if (Test-Path emu/root/registry) { "emu/root" } else { "emu" }
          python .github/vmpunpack-nettest.py --analyzer pkg --root $root
          if ($LASTEXITCODE) { throw "the network containment check failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: sogen-vmpunpack-win-x64
          path: sogen-vmpunpack-win-x64.zip
          retention-days: 30
